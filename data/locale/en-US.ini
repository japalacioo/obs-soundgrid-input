AudioMonitorExists="The audio monitor scene already exists."
AudioMonitorSafety="If someone clicks the monitor in the Multiview, the plugin returns program and preview to the previous scene so it never goes on air. To avoid even that brief switch, turn off the Multiview option to switch scenes with a click in Settings > General > Multiview."
