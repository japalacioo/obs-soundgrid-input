SetupInfoTitle="Steps"
SetupInfo="1) Install Waves SoundGrid Driver V17 and pick the network card in its Control Panel. 2) On the LV1, assign the driver in Setup > Inventory and send Main L/R to its inputs in Patch > Output. 3) Here, press 'Detect…' and choose the L/R inputs. If the driver does not start after assigning it, set the port to 'None' and back in the Control Panel. The plugin never changes the console."
