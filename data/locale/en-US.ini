AudioMonitorAutoScene="Create this scene when OBS starts (all of OBS)"
AudioMonitorAutoSceneHelp="Setting for all of OBS. If the audio monitor scene is missing, the plugin creates it when OBS starts or the scene collection changes, so the monitor shows in the Multiview with no manual steps. If you turn this off, you can delete the scene and it will not be created again."
AudioMonitorInfoTitle="How it works"
AudioMonitorInfo="Classic view: L/R meters (green, yellow and red like OBS, dBFS scale and 20 s peak hold), an oscilloscope of the last seconds (newest on the right), Peak and RMS in dBFS, a clip indicator (−0.1 dBFS, lit for 5 s) and the name of the topmost visible SoundGrid source of the on-air scene, before OBS filters and volume. Loudness view (ITU-R BS.1770-4): momentary, short-term and integrated LUFS, true peak, LRA, PLR, PSR and DR against the chosen target, with history and distribution; it measures after filters and before volume, like the OBS mixer."
