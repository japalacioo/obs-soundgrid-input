AlertsInfoTitle="How they work"
AlertsInfo="Alerts are written to the OBS log and to alerts.jsonl (plugin config folder). A network failure groups its consequences into one incident. End-to-end latency is not measured: only the driver→OBS segment. No alert changes the audio or the console."
