AlertsInfoTitle="How they work"
AlertsInfo="If audio stops arriving (no samples, driver lost, cable unplugged or, if enabled, prolonged silence), a red bar appears at the top of OBS; click it to open this panel. It turns green when audio comes back. Alerts are also written to the OBS log and to alerts.jsonl. No alert changes the audio or the console."
