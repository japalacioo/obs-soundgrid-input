KeepWaves="Keep the SoundGrid Driver Control Panel and its service open (all of OBS, even without sources)"
KeepWavesHelp="If the Waves service (SGDawNodeService) or the SoundGrid Driver Control Panel is not running, or closes during a stream, the plugin reopens it minimized without taking focus from OBS. This is an OBS-wide setting: it works even with no SoundGrid source. It uses the same program Waves registers, never changes its settings and never asks for administrator rights. If they close several times in a row it stops reopening them and shows it in the status."
