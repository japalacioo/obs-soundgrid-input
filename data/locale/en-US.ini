GlobalMonitor="Monitor the Waves driver audio even without sources (all of OBS)"
GlobalMonitorHelp="OBS-wide setting. With no SoundGrid source, the plugin listens to the Waves driver (inputs 1–2) and the network card of its Control Panel, and shows the red bar if audio stops, the driver drops or the cable is unplugged. It holds the driver while OBS is open. With sources, it shares their stream. Without sources, turn it off in Tools > SoundGrid Monitor."
