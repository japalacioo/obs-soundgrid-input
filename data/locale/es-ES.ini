AudioMonitorAutoScene="Crear esta escena al abrir OBS (en todo OBS)"
AudioMonitorAutoSceneHelp="Ajuste de todo OBS. Si falta la escena del monitor de audio, el plugin la crea al abrir OBS o al cambiar de colección de escenas, para que el monitor aparezca en el Multiview sin pasos manuales. Si la desactivas, puedes borrar la escena y no se vuelve a crear."
AudioMonitorInfoTitle="Cómo funciona"
AudioMonitorInfo="Vista clásica: medidores L/R (verde, amarillo y rojo como OBS, escala en dBFS y peak hold de 20 s), osciloscopio de los últimos segundos (lo más reciente a la derecha), Peak y RMS en dBFS, aviso de clip (−0,1 dBFS, 5 s encendido) y nombre de la fuente SoundGrid visible más arriba en la escena al aire, antes de los filtros y del volumen de OBS. Vista de sonoridad (ITU-R BS.1770-4): momentary, short-term e integrated en LUFS, true peak, LRA, PLR, PSR y DR respecto al objetivo elegido, con historial y distribución; mide tras los filtros y antes del volumen, como el mezclador de OBS."
