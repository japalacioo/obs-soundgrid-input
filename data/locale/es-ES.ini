KeepWaves="Mantener abiertos el SoundGrid Driver Control Panel y su servicio (en todo OBS, aunque no haya fuentes)"
KeepWavesHelp="Si el servicio de Waves (SGDawNodeService) o el SoundGrid Driver Control Panel no están abiertos, o se cierran durante una transmisión, el plugin los vuelve a abrir minimizados y sin quitar el foco a OBS. Es un ajuste de todo OBS: funciona aunque no haya ninguna fuente SoundGrid. Usa el mismo programa que registra Waves, nunca cambia su configuración ni pide permisos de administrador. Si se cierran varias veces seguidas, deja de reabrirlos y lo indica en el estado."
