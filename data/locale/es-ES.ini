AlertsInfo="Las alertas se registran en el log de OBS y en alerts.jsonl (carpeta de configuración del plugin). Una caída de red agrupa sus consecuencias en un único incidente. La latencia de extremo a extremo no se mide: solo el tramo driver→OBS. Ninguna alerta cambia el audio ni la consola."
