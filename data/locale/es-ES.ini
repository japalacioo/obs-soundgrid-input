AlertsInfoTitle="Cómo funcionan"
AlertsInfo="Si deja de llegar audio (sin muestras, driver perdido, cable desconectado o, si lo activas, silencio prolongado) aparece una barra roja en la parte superior de OBS; haz clic en ella para abrir este panel. Se vuelve verde cuando el audio regresa. Las alertas también quedan en el log de OBS y en alerts.jsonl. Ninguna alerta cambia el audio ni la consola."
