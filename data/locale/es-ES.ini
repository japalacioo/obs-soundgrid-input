SetupInfoTitle="Pasos"
SetupInfo="1) Instala Waves SoundGrid Driver V17 y elige la tarjeta de red en su Control Panel. 2) En la LV1, asigna el driver en Setup > Inventory y envía Main L/R a sus entradas en Patch > Output. 3) Aquí, pulsa «Detectar…» y elige las entradas L/R. Si el driver no arranca tras asignarlo, cambia el puerto a «None» y vuelve a elegirlo en el Control Panel. El plugin nunca modifica la consola."
