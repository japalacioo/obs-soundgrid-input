GlobalMonitor="Vigilar el audio del driver Waves aunque no haya fuentes (en todo OBS)"
GlobalMonitorHelp="Ajuste de todo OBS. Sin ninguna fuente SoundGrid, el plugin escucha el driver Waves (entradas 1–2) y la tarjeta de red de su Control Panel, y muestra la barra roja si deja de llegar audio, se cae el driver o se desconecta el cable. Ocupa el driver mientras OBS está abierto. Con fuentes, comparte su stream. Sin fuentes, se desactiva en Herramientas > SoundGrid Monitor."
